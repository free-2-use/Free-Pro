<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download CapCut Pro APK</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00EAFF;
            --primary-hover: #00D6E8;
            --bg-color: #F8FAFC;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0F172A;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 234, 255, 0.2) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(255, 255, 255, 0) 0, transparent 50%), 
                radial-gradient(at 100% 0%, rgba(0, 166, 255, 0.15) 0, transparent 50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Static background elements for better performance */
        .blob {
            position: absolute;
            z-index: -1;
            border-radius: 50%;
        }
        .blob-1 {
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 234, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        }
        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 166, 255, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            position: relative;
            z-index: 1;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.15);
        }

        .logo-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px auto;
            border-radius: 22px;
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            padding: 2px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            display: block;
            background: #000;
        }

        h1 { 
            margin: 0 0 10px 0; 
            font-size: 28px; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            background: linear-gradient(to right, #0F172A, #334155);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rating-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .stars {
            color: #FBBF24;
            font-size: 16px;
            letter-spacing: 2px;
        }

        .divider {
            color: rgba(0, 0, 0, 0.1);
        }

        .btn-container {
            position: relative;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--primary);
            color: #0F172A;
            text-decoration: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            cursor: pointer;
            border: 1px solid rgba(0, 234, 255, 0.5);
            width: 100%;
            box-shadow: 0 10px 20px -10px rgba(0, 234, 255, 0.5);
            overflow: hidden;
            position: relative;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            transition: all 0.75s ease;
        }

        .btn:hover:not(.loading)::after {
            left: 150%;
        }

        .btn.loading { 
            background: rgba(0,0,0,0.05); 
            color: var(--text-muted);
            cursor: wait; 
            box-shadow: none;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .btn:hover:not(.loading) { 
            transform: translateY(-2px);
            box-shadow: 0 15px 25px -10px rgba(0, 234, 255, 0.6);
            background: var(--primary-hover);
        }
        
        .download-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        /* Styled container for the rendered Markdown content */
        .release-description {
            margin-top: 30px;
            font-size: 14px;
            color: #334155;
            line-height: 1.7;
            text-align: left;
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 20px;
            border-radius: 16px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
            text-align: left;
        }
        
        /* Custom Scrollbar */
        .release-description::-webkit-scrollbar {
            width: 6px;
        }
        .release-description::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.02);
            border-radius: 10px;
        }
        .release-description::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.15);
            border-radius: 10px;
        }
        .release-description::-webkit-scrollbar-thumb:hover {
            background: rgba(0,0,0,0.25);
        }

        .release-description p { margin: 0 0 12px 0; }
        .release-description p:last-child { margin-bottom: 0; }
        .release-description strong { color: #0F172A; font-weight: 600; }
        .release-description ol, .release-description ul {
            margin: 10px 0 0 0;
            padding-left: 20px;
        }
        .release-description li { margin-bottom: 8px; }
        .release-description li:last-child { margin-bottom: 0; }
        .release-description a { color: #00A3B8; text-decoration: none; }
        .release-description a:hover { text-decoration: underline; }
        
        .developer-name {
            font-size: 14px;
            color: #00A6FF;
            font-weight: 600;
            margin-top: -5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .developer-name:hover {
            opacity: 0.8;
        }

        .verified-icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
        
        .version-badge {
            display: inline-block;
            background: rgba(0, 234, 255, 0.15);
            color: #007A8A;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 234, 255, 0.3);
        }
        
        .security-note {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 15px;
            line-height: 1.4;
            opacity: 0.8;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="card">
    <div class="version-badge" id="versionBadge" style="display: none;">Latest Version</div>
    
    <div class="logo-container">
        <img src="logo.png" alt="CapCut Pro" class="logo-img" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23333\'/><text x=\'50\' y=\'55\' font-family=\'Arial\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\'>CC</text></svg>';">
    </div>
    
    <h1>CapCut Pro</h1>
    
    <a href="https://www.capcut.com/" target="_blank" rel="noopener noreferrer" class="developer-name">
        Bytedance Pte. Ltd.
        <svg class="verified-icon" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
    </a>
    
    <div class="rating-container">
        <span class="stars">★★★★★</span>
        <span>4.9</span>
        <span class="divider">•</span>
        <span>1M+ Downloads</span>
    </div>
    
    <div class="btn-container">
        <a id="downloadBtn" class="btn loading">
            <svg class="download-icon" viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
            </svg>
            <span>Checking Version...</span>
        </a>
        <div class="security-note">Note: Android may show a "File might be harmful" warning. This is standard for apps outside the Play Store. Simply tap <strong>"Download anyway"</strong> to safely proceed.</div>
    </div>

    <div id="descriptionBox" class="release-description" style="display: none;"></div>
</div>

<script>
    const owner = 'free-2-use';
    const repo = 'Free-Pro';

    const downloadBtn = document.getElementById('downloadBtn');
    const btnText = downloadBtn.querySelector('span');
    const descriptionBox = document.getElementById('descriptionBox');
    const versionBadge = document.getElementById('versionBadge');

    fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`)
        .then(response => response.json())
        .then(data => {
            const apkAsset = data.assets && data.assets.find(asset => asset.name.endsWith('.apk'));
            const releaseTag = data.tag_name || '';
            const releaseBody = data.body || '';
            
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            
            if (apkAsset) {
                const downloadUrl = apkAsset.browser_download_url;
                
                btnText.innerText = `Download ${releaseTag}`.trim();
                downloadBtn.classList.remove('loading');
                
                if(releaseTag) {
                    versionBadge.innerText = `Latest: ${releaseTag}`;
                    versionBadge.style.display = 'inline-block';
                }
                
                if (releaseBody.trim() !== "") {
                    descriptionBox.innerHTML = marked.parse(releaseBody);
                    descriptionBox.style.display = 'block';
                }

                downloadBtn.addEventListener('click', (e) => {
                    e.preventDefault(); // Always prevent default to control the flow

                    if (isAndroid) {
                        // 1. Strip https:// for the intent
                        const urlWithoutScheme = downloadUrl.replace(/^https?:\/\//, '');
                        // 2. Encode the original URL as a fallback
                        const fallbackUrl = encodeURIComponent(downloadUrl);
                        
                        // 3. Construct the absolute Chrome intent
                        const chromeIntent = `intent://${urlWithoutScheme}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallbackUrl};end`;
                        
                        // Fire the intent to force open Chrome
                        window.location.href = chromeIntent;
                        
                        // 4. Failsafe: If the intent is blocked or Chrome isn't installed, 
                        // force the standard download 1.5 seconds later
                        setTimeout(() => {
                            window.location.href = downloadUrl;
                        }, 1500);
                    } else {
                        // iOS or Desktop: just download normally
                        window.location.href = downloadUrl;
                    }
                });
            } else {
                btnText.innerText = 'No APK Found';
                downloadBtn.querySelector('svg').style.display = 'none';
            }
        })
        .catch(err => {
            console.error(err);
            btnText.innerText = 'Download Unavailable';
            downloadBtn.querySelector('svg').style.display = 'none';
        });
</script>

</body>
</html>
