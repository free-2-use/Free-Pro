<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Free-Pro APK</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #1e1e1e;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            border: 1px solid #2a2a2a;
        }
        .logo-placeholder {
            width: 70px;
            height: 70px;
            background: #2563eb;
            border-radius: 18px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 28px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
        }
        h1 { margin: 0 0 10px 0; font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        p { color: #aaaaaa; font-size: 14px; line-height: 1.6; margin: 0 0 30px 0; }
        .btn {
            display: block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 16px;
            transition: background 0.2s, transform 0.1s;
            box-sizing: border-box;
            cursor: pointer;
        }
        .btn.loading { background: #4b5563; cursor: wait; }
        .btn:hover:not(.loading) { background: #1d4ed8; }
        .warning {
            margin-top: 25px;
            font-size: 13px;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-placeholder">FP</div>
    <h1>Free-Pro Installer</h1>
    <p>Tap below to safely download the official APK directly to your mobile device.</p>
    
    <a id="downloadBtn" class="btn loading">Checking Latest Version...</a>

    <div class="warning">
        <strong>TikTok / Facebook Users:</strong> If your download doesn't begin immediately, tap the <strong>three dots (...)</strong> in the top-right corner and select <strong>"Open in Browser"</strong>.
    </div>
</div>

<script>
    // Configured for your specific profile and repository names
    const owner = 'free-2-use';
    const repo = 'Free-Pro';

    const downloadBtn = document.getElementById('downloadBtn');

    // Query the public API backend for your repo's latest stack entry
    fetch(`https://api.github.com/repos/${owner}/${repo}/releases/latest`)
        .then(response => response.json())
        .then(data => {
            // Find any asset file ending with the extension .apk
            const apkAsset = data.assets.find(asset => asset.name.endsWith('.apk'));
            
            if (apkAsset) {
                const downloadUrl = apkAsset.browser_download_url;
                
                // Inject target URL directly into the view layout
                downloadBtn.innerText = 'Download APK';
                downloadBtn.classList.remove('loading');
                downloadBtn.href = downloadUrl;

                // Handle system browser exit routines for targeted social spaces
                const userAgent = navigator.userAgent || navigator.vendor || window.opera;
                const isAndroid = /android/i.test(userAgent);
                const isInApp = /FBAN|FBAV|TikTok/i.test(userAgent);

                if (isAndroid && isInApp) {
                    const chromeIntent = downloadUrl.replace('https://', 'intent://') + '#Intent;scheme=https;package=com.android.chrome;end';
                    setTimeout(() => {
                        window.location.href = chromeIntent;
                    }, 400);
                }
            } else {
                downloadBtn.innerText = 'No APK found in latest release';
            }
        })
        .catch(err => {
            console.error(err);
            downloadBtn.innerText = 'Error loading download';
        });
</script>

</body>
</html>
